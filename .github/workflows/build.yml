name: Build Mura DVW Companion module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install Yarn 4.12.0
        run: corepack prepare yarn@4.12.0 --activate

      - name: Check versions
        run: |
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install

      - name: Build module
        run: yarn package

      - name: Find package
        run: |
          echo "Generated packages:"
          find . -name "*.tgz" -type f -print

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: matrox-mura-dvw-module
          path: "*.tgz"
          if-no-files-found: error
